<header class="header" [class.scrolled]="isScrolled()">
  <div class="container">
    <nav class="nav">
      <button type="button" class="nav-brand" (click)="navigate('home')">
        <span class="brand-text">João Leão</span>
        <span class="brand-tag">dev · dados · mapas</span>
      </button>

      <!-- Desktop Navigation -->
      <ul class="nav-menu">
        @for (item of navItems; track item.id) {
          <li>
            <button
              type="button"
              class="nav-link"
              [class.active]="isActive(item.id)"
              (click)="navigate(item.id)"
            >
              {{ item.label }}
            </button>
          </li>
        }
      </ul>

      <a
        href="https://github.com/joaoleaogf"
        target="_blank"
        rel="noopener noreferrer"
        class="github-link"
        aria-label="GitHub Profile"
      >
        GitHub ↗
      </a>

      <button
        type="button"
        class="mobile-menu-toggle"
        (click)="toggleMobileMenu()"
        aria-label="Toggle menu"
      >
        {{ mobileMenuOpen() ? 'fechar' : 'menu' }}
      </button>
    </nav>

    @if (mobileMenuOpen()) {
      <div class="mobile-menu">
        <ul>
          @for (item of navItems; track item.id) {
            <li>
              <button
                type="button"
                class="mobile-nav-link"
                [class.active]="isActive(item.id)"
                (click)="navigate(item.id)"
              >
                {{ item.label }}
              </button>
            </li>
          }
        </ul>
      </div>
    }
  </div>
</header>
